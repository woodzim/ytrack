stages:
  - build
  - deploy

variables:
  NODE_VERSION: "22.12.0"

# Build assets dengan npm
build_assets:
  stage: build
  image: node:${NODE_VERSION}
  only:
    - main
  script:
    - echo "Installing dependencies..."
    - npm ci --prefer-offline --no-audit
    - echo "Building production assets..."
    - npm run build
    - echo "✅ Build completed successfully!"
  artifacts:
    paths:
      - public/build/
    expire_in: 7 days
  cache:
    key: ${CI_COMMIT_REF_SLUG}-npm
    paths:
      - node_modules/

# Trigger server untuk pull dan deploy
deploy_to_server:
  stage: deploy
  image: alpine:latest
  only:
    - main
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $SERVER_HOST >> ~/.ssh/known_hosts
  script:
    - echo "Syncing built assets to server..."
    - rsync -avz --delete public/build/ $SERVER_USER@$SERVER_HOST:$DEPLOY_PATH/public/build/

    - echo "Executing deployment on server..."
    - |
      ssh $SERVER_USER@$SERVER_HOST "cd $DEPLOY_PATH && \
        echo '📥 Pulling latest code from main...' && \
        git pull origin main && \
        echo '📦 Installing Composer dependencies...' && \
        composer install --no-dev --optimize-autoloader --no-interaction && \
        echo '🔄 Running Laravel commands...' && \
        php artisan optimize:clear && \
        php artisan optimize && \
        echo '✅ Deployment completed!'"
  dependencies:
    - build_assets
  environment:
    name: production
    url: $PRODUCTION_URL
